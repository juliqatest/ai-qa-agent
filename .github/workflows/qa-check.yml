name: AI QA Agent - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Verify imports
        run: |
          python -c "from google import genai; print('Gemini SDK OK')"
          python -c "from playwright.sync_api import sync_playwright; print('Playwright OK')"

      - name: Run Playwright smoke test
        run: python ci_smoke_test.py

      - name: Run AI QA Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI_STORY: "Como usuario quiero iniciar sesión con mi usuario y contraseña para acceder al sistema."
        run: python app.py

      - name: Verify Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "import os; assert os.getenv('GEMINI_API_KEY'), 'GEMINI_API_KEY is missing'; print('Gemini secret available')"

      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from google import genai

          client = genai.Client()

          response = client.models.generate_content(
              model="gemini-3.5-flash-lite",
              contents="Respondé únicamente con: GEMINI_OK"
          )

          assert "GEMINI_OK" in response.text
          print("Gemini API connection OK")
          PY
